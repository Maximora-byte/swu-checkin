name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-quality:
    name: linux-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.15"
          enable-cache: true

      - name: 按锁文件安装依赖
        run: |
          uv python install 3.13
          uv sync --locked --all-groups --python 3.13

      - name: 运行测试
        run: uv run --locked pytest -q

      - name: Ruff 检查
        run: uv run --locked ruff check .

      - name: Ruff 格式检查
        run: uv run --locked ruff format --check .

      - name: mypy 类型检查
        run: uv run --locked mypy src/swu_checkin

      - name: Windows PowerShell 脚本检查
        shell: pwsh
        run: ./tests/windows/test_windows_scripts.ps1

      - name: GitHub Actions 语法检查
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: systemd 单元校验
        run: |
          if ! id -u swu-checkin >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin swu-checkin
          fi
          sudo install -d /opt/swu-checkin/.venv/bin /etc/swu-checkin
          sudo install -m 0755 /usr/bin/true /opt/swu-checkin/.venv/bin/swu-checkin
          sudo install -m 0755 /usr/bin/true /opt/swu-checkin/.venv/bin/swu-checkin-notify
          sudo install -m 0600 /dev/null /etc/swu-checkin/credentials.env
          sudo install -m 0600 /dev/null /etc/swu-checkin/notify.env
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer

      - name: 状态文件 Unix 权限验证
        run: sudo env SWUDK_TEST_PYTHON="$PWD/.venv/bin/python" bash deploy/verify-state-permissions.sh

      - name: 生产依赖漏洞审计
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            | uv run --locked pip-audit -r /dev/stdin

  windows-quality:
    name: windows-quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装固定版本 uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Windows PowerShell 5.1 集成检查
        shell: powershell
        run: .\tests\windows\test_windows_scripts.ps1 -WindowsIntegration

      - name: PowerShell 7 集成检查
        shell: pwsh
        run: .\tests\windows\test_windows_scripts.ps1 -WindowsIntegration

      - name: 验证 locked 非 editable 安装
        shell: powershell
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "swu-checkin-locked-venv"
          uv python install 3.13
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 installation failed." }
          uv sync --locked --no-dev --no-editable --project $env:GITHUB_WORKSPACE --python 3.13
          if ($LASTEXITCODE -ne 0) { throw "Locked installation failed." }
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "src"
          $hiddenSourcePath = Join-Path $env:GITHUB_WORKSPACE "src.checkout-hidden"
          Rename-Item -LiteralPath $sourcePath -NewName "src.checkout-hidden"
          try {
            & (Join-Path $env:UV_PROJECT_ENVIRONMENT "Scripts\swu-checkin.exe") --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI depends on the source checkout." }
          }
          finally {
            Rename-Item -LiteralPath $hiddenSourcePath -NewName "src"
          }

  quality:
    name: quality
    if: ${{ always() }}
    needs: [linux-quality, windows-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总 Linux 与 Windows 门禁
        env:
          LINUX_RESULT: ${{ needs.linux-quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-quality.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
