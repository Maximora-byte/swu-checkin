name: Windows desktop build

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/windows/**"
      - "scripts/windows/build.ps1"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out requested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up official Python with Tcl/Tk
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.7'
          architecture: x64

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.15'
          enable-cache: false

      - name: Install pinned Inno Setup compiler
        run: |
          choco install innosetup --version=6.4.3 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build and run offline frozen self-test
        run: ./scripts/windows/build.ps1

      - name: Upload unsigned installer, onedir bundle and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swu-checkin-windows-x64-${{ github.sha }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
