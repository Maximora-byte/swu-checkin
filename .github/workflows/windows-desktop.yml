name: Windows desktop build

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/windows/**"
      - "packaging/license_inventory.py"
      - "packaging/licenses/**"
      - "scripts/windows/build.ps1"
      - "scripts/windows/verify-install.ps1"
      - "scripts/windows/verify-portable.ps1"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out requested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up official Python with Tcl/Tk
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'
          architecture: x64

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.15'
          enable-cache: false

      - name: Install pinned Inno Setup compiler
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $CompilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $Installer
          $Expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $Installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Expected) {
            throw 'Official Inno Setup installer SHA256 mismatch.'
          }
          $Process = Start-Process -FilePath $Installer -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', "/DIR=`"$CompilerDir`"" -PassThru
          if (-not $Process.WaitForExit(180000)) { $Process.Kill(); throw 'Inno Setup installation timed out.' }
          $Process.Refresh()
          if ($Process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build and run offline frozen self-test
        run: ./scripts/windows/build.ps1 -Iscc (Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe')

      - name: Verify extracted portable ZIP without administrator rights or toolchain
        run: ./scripts/windows/verify-portable.ps1

      - name: Verify isolated installation, GUI and uninstall
        run: ./scripts/windows/verify-install.ps1

      - name: Upload unsigned portable ZIP and its checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swu-checkin-windows-portable-x64-${{ inputs.ref || github.sha }}
          path: |
            dist/windows/*-win-x64-Portable.zip
            dist/windows/*-win-x64-Portable.zip.sha256
            dist/windows/BUILD-INFO.json
            dist/windows/TOOLCHAIN.txt
            dist/windows/LICENSE-INVENTORY.json
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned installer, onedir bundle and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swu-checkin-windows-x64-${{ inputs.ref || github.sha }}
          path: |
            dist/windows/
            !dist/windows/*-win-x64-Portable.zip
            !dist/windows/*-win-x64-Portable.zip.sha256
          if-no-files-found: error
          retention-days: 14
