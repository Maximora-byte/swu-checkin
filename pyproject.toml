[project]
name = "swu-checkin"
version = "1.1.3"
description = "西南大学钉钉查寝自动打卡脚本"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Sorynthia" }
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "Pillow>=9.0.0",
    "ddddocr>=1.4.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pip-audit>=2.10.1",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-requests>=2.32.0",
]

[project.scripts]
swu-checkin = "swu_checkin.cli:main"
swu-checkin-notify = "swu_checkin.notify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/swu_checkin"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "swu_checkin.api_models",
    "swu_checkin.auth",
    "swu_checkin.client",
    "swu_checkin.service",
    "swu_checkin.token_store",
]
disallow_any_generics = true
disallow_untyped_defs = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "ddddocr"
ignore_missing_imports = true
